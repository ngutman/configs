# Multi-agent compact sidebar layout.
# Source from ~/.tmux.conf.local.

set -g @agent_order "orch plan impl review docs"
set -g @agent_sidebar_width 45
set -g @agent_compact_window_name "__agents_compact"
set -g @agent_pool_window_name "__agent_pool"
set -g @agent_wide_window_name_default "agents"

bind-key m run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout compact"
bind-key M run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout wide"
bind-key N run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout new"
bind-key x confirm-before -p "kill pane #P? (y/n)" "run-shell 'AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION=\"#{session_id}\" AGENT_LAYOUT_PANE=\"#{pane_id}\" $HOME/.tmux/scripts/agent-layout kill-current'"
bind-key a run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout focus-sidebar"
bind-key -r ] run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout next"
bind-key -r [ run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout prev"
bind-key -r Down run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout next"
bind-key -r Up run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout prev"
bind-key Tab run-shell "AGENT_LAYOUT_NOTIFY=1 AGENT_LAYOUT_SESSION='#{session_id}' AGENT_LAYOUT_PANE='#{pane_id}' $HOME/.tmux/scripts/agent-layout toggle-last"

# kill-pane recovery is handled synchronously by the custom prefix-x binding.
set-hook -gu after-kill-pane

# Example pane title bootstrap for a five-agent window.
# Run these once after creating your panes:
#   tmux select-pane -t :.0 -T orch
#   tmux select-pane -t :.1 -T plan
#   tmux select-pane -t :.2 -T impl
#   tmux select-pane -t :.3 -T review
#   tmux select-pane -t :.4 -T docs
